<!DOCTYPE html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин годинників</title>
    <link rel="stylesheet" href="lab9.css">
</head>
<body>
    <header class="header">
        <h1>Магазин годинників</h1>
        <p>Колекція класичних та смарт-годинників</p>
    </header>

    <main class="container">
        <section class="store-section">
            <h2>Вітрина годинників</h2>
            <div id="products-grid" class="products-grid">
            </div>
        </section>

        <aside class="basket-section">
            <div class="basket-header">
                <h2>Кошик</h2>
                <span id="basket-count" class="badge">0</span>
            </div>
            <div id="basket-list" class="basket-list">
                <p class="empty-msg">Кошик поки порожній</p>
            </div>
        </aside>
    </main>

    <script src="lab9.js"></script>
</body>
</html>
